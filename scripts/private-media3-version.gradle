// PRIVATE COMPARISON ONLY. Never merge or use for a store build.
if (System.getenv('GITHUB_REF') != 'refs/heads/diagnostic/media3-clipping-111-20261107') {
    throw new GradleException('Private Media3 comparison requires its isolated diagnostic branch')
}
def comparisonVersion = System.getenv('CAPTION_PRIVATE_MEDIA3_VERSION')
if (!(comparisonVersion in ['1.10.1', '1.11.0'])) {
    throw new GradleException('Private comparison version must be explicit and reviewed')
}
gradle.beforeProject { project ->
    project.configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'androidx.media3') {
                details.useVersion(comparisonVersion)
                details.because('Private paired reordered-clipping comparison; not a release configuration')
            }
        }
    }

    if (project.path == ':app') {
        // Capture the root report location during configuration; resolution belongs
        // to the app task so Gradle 9.4 holds the runtime configuration owner's lock.
        def reportFile = project.rootProject.layout.buildDirectory.file('reports/private-media3-resolution.txt')
        project.tasks.register('verifyPrivateMedia3Resolution') {
            def media3Components = project.configurations.named('releaseRuntimeClasspath').map { config ->
                // Component graph only: files ambiguously select AGP's secondary
                // artifact variants (classes/assets/profiles/metadata).
                config.incoming.resolutionResult.allComponents.collect { component ->
                    def id = component.id
                    id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier &&
                        id.group == 'androidx.media3' ? id.displayName : null
                }.findAll { it != null }.unique().sort()
            }
            doLast {
                def components = media3Components.get()
                if (components.isEmpty() || components.any { !it.endsWith(':' + comparisonVersion) }) {
                    throw new GradleException('Media3 runtime resolution is empty or mixed: ' + components)
                }
                def report = reportFile.get().asFile
                report.parentFile.mkdirs()
                report.text = components.join('\n') + '\n'
                println('PRIVATE Media3 resolution: ' + components.join(', '))
            }
        }
    }
}
