name: Unsigned Play AAB build-only 1.4.129
on:
  push:
    branches: [codex/build-only-play-129-141]
  pull_request:
    paths:
      - .github/workflows/unsigned-play-aab.yml
      - scripts/unsigned-play-release.gradle
      - scripts/verify-unsigned-play-aab.mjs
      - tests/unsigned-play-aab.test.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unsigned-play-129-141-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.4
      - name: Install companion build JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'
          check-latest: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17.0.21+9'
          check-latest: true
      - name: Harden and verify Java trust stores
        run: node scripts/harden-java-truststores.mjs --ci
      - name: Run executable packaging regressions
        run: node --test tests/unsigned-play-aab.test.mjs
  package:
    needs: regressions
    if: >-
      github.repository == 'Hatsunama/Caption-Studio' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/codex/build-only-play-129-141' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: true
      CAPTION_STUDIO_EXPECTED_ANDROID_PACKAGE: com.xmilo_at_your_side.caption_studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out exact approved product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: eea3fe3afdc1382be2ae1e8de2b7b53c2003f23b
          path: release-source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: release-source/package-lock.json
      - name: Install companion build JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'
          check-latest: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17.0.21+9'
          check-latest: true
      - name: Harden and verify Java trust stores
        run: node scripts/harden-java-truststores.mjs --ci
      - name: Approve source and refuse signing inputs before installation
        run: node scripts/verify-unsigned-play-aab.mjs --approve release-source
      - name: Run full existing source release checks
        working-directory: release-source
        run: |
          npm ci
          npm run verify:product-contract
          npm audit --omit=dev --audit-level=high
          npm run test:logic
          npx tsc --noEmit
          npm run lint
          npx expo install --check
          npx --yes expo-doctor@1.21.5
      - name: Stamp same configuration as approved 129/141 APK build
        run: node scripts/verify-unsigned-play-aab.mjs --prepare release-source
      - name: Generate clean native project and verify original release configuration
        working-directory: release-source
        env:
          NODE_ENV: production
        run: |
          npx expo prebuild --platform android --clean --no-install
          node scripts/patch-react-native-gradle.js
          npm run verify:android-config
      - name: Behaviorally refuse Gradle property and environment credentials
        working-directory: release-source/android
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          for name in CAPTION_STUDIO_RELEASE_STORE_FILE CAPTION_STUDIO_RELEASE_STORE_PASSWORD CAPTION_STUDIO_RELEASE_KEY_ALIAS CAPTION_STUDIO_RELEASE_KEY_PASSWORD; do
            if ./gradlew help "-P$name=FORBIDDEN-TEST-INPUT" --init-script ../../scripts/unsigned-play-release.gradle --no-daemon > "$RUNNER_TEMP/unsigned-refusal.log" 2>&1; then
              echo 'Unsigned init accepted credential property' >&2; exit 1
            fi
            grep -Fq "Unsigned packaging refuses signing credential input: $name" "$RUNNER_TEMP/unsigned-refusal.log"
          done
          if env ORG_GRADLE_PROJECT_CAPTION_STUDIO_RELEASE_KEY_ALIAS=FORBIDDEN-TEST-INPUT ./gradlew help --init-script ../../scripts/unsigned-play-release.gradle --no-daemon > "$RUNNER_TEMP/unsigned-refusal.log" 2>&1; then
            echo 'Unsigned init accepted credential environment' >&2; exit 1
          fi
          grep -Fq 'Unsigned packaging refuses signing credential input:' "$RUNNER_TEMP/unsigned-refusal.log"
      - name: Native release lint with unsigned configuration
        working-directory: release-source/android
        env:
          NODE_ENV: production
        run: ./gradlew :app:lintRelease --init-script ../../scripts/unsigned-play-release.gradle --init-script ../scripts/first-party-android-lint.gradle --no-daemon --stacktrace --warning-mode all
      - name: Native release unit tests with unsigned configuration
        working-directory: release-source/android
        env:
          NODE_ENV: production
        run: ./gradlew :app:testReleaseUnitTest :caption-diagnostics:testReleaseUnitTest :caption-media:testReleaseUnitTest :caption-translation:testReleaseUnitTest --init-script ../../scripts/unsigned-play-release.gradle --no-daemon --stacktrace --warning-mode all
      - name: Build unsigned release AAB
        working-directory: release-source/android
        env:
          NODE_ENV: production
        run: ./gradlew :app:bundleRelease --init-script ../../scripts/unsigned-play-release.gradle --no-daemon --stacktrace --warning-mode all
      - name: Download checksum-pinned bundletool
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  '"$RUNNER_TEMP/bundletool.jar" | sha256sum --check --status
      - name: Validate unsigned bundle identity, ABI, 16KB ELF, mapping and provenance
        run: |
          set -euo pipefail
          ndk_root="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          objdump="$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"
          test -x "$objdump"
          node scripts/verify-unsigned-play-aab.mjs --verify release-source "$RUNNER_TEMP/bundletool.jar" "$objdump"
      - name: Retain native reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unsigned-play-native-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-source/android/app/build/reports/
            release-source/android/app/build/test-results/
            release-source/modules/caption-*/android/build/reports/tests/
            release-source/modules/caption-*/android/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain unsigned AAB for later LOCAL signing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: caption-studio-play-UNSIGNED-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/caption-studio-play-unsigned.aab
            dist/caption-studio-play-mapping.txt
            dist/play-unsigned-approval.json
            dist/play-unsigned-provenance.json
          if-no-files-found: error
          retention-days: 14
