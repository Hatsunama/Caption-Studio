name: Prepare reviewed Expo 57 lockfile
on:
  pull_request:
    paths: ['.github/workflows/prepare-expo-lockfile.yml']
permissions:
  contents: read
jobs:
  lock:
    if: github.repository == 'Hatsunama/Caption-Studio' && github.actor == 'Hatsunama' && github.triggering_actor == 'Hatsunama' && github.event.pull_request.number == 178 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/translation-runtime-eligibility-149'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.4
      - name: Generate lock without installing application dependencies
        run: |
          set -euo pipefail
          npm install --global npm@10.9.9 --ignore-scripts --no-audit --no-fund
          mkdir -p evidence/expo-lock
          cp package-lock.json evidence/expo-lock/package-lock.before.json
          node --version > evidence/expo-lock/node-version.txt
          npm --version > evidence/expo-lock/npm-version.txt
          git rev-parse HEAD > evidence/expo-lock/source-commit.txt
          sha256sum package.json > evidence/expo-lock/manifest.sha256
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          cp package-lock.json evidence/expo-lock/package-lock.json
          node - <<'NODE'
          const fs = require('node:fs'), cp = require('node:child_process');
          const before = JSON.parse(fs.readFileSync('evidence/expo-lock/package-lock.before.json'));
          const after = JSON.parse(fs.readFileSync('package-lock.json'));
          const changes = [];
          for (const name of [...new Set([...Object.keys(before.packages), ...Object.keys(after.packages)])].sort()) {
            const old = before.packages[name], next = after.packages[name];
            if (JSON.stringify(old) === JSON.stringify(next)) continue;
            changes.push({path:name,before:old??null,after:next??null});
          }
          fs.writeFileSync('evidence/expo-lock/changes.json', JSON.stringify(changes,null,2));
          const specs = new Set(changes.flatMap(({path,before,after}) => [before,after].filter(x=>x?.version && x?.resolved?.startsWith('https://registry.npmjs.org/')).map(x=>path.split('node_modules/').at(-1)+'@'+x.version)));
          const metadata = {};
          for (const spec of specs) metadata[spec]=JSON.parse(cp.execFileSync('npm',['view',spec,'--json','--registry=https://registry.npmjs.org'],{encoding:'utf8',maxBuffer:8*1024*1024}));
          fs.writeFileSync('evidence/expo-lock/registry-metadata.json',JSON.stringify(metadata,null,2));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: expo57-lock-${{ github.event.pull_request.head.sha }}
          path: evidence/expo-lock/
          retention-days: 7
          if-no-files-found: error
