name: Private actual RN minimum-scale regression

on:
  push:
    branches: [diagnostic/minscale-regression-20261108]

permissions:
  contents: read

jobs:
  native-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.4
          cache: npm
      - name: Fetch and verify exact signed build JDKs
        run: |
          mkdir -p evidence
          node scripts/build-toolchain/verified-java-download.mjs --install "$RUNNER_TOOL_CACHE" --receipt "$GITHUB_WORKSPACE/evidence/verified-java.json"
      - name: Harden and verify Java trust stores
        run: node scripts/harden-java-truststores.mjs --ci
      - name: Install locked dependencies
        run: |
          set -o pipefail
          mkdir -p evidence
          npm ci 2>&1 | tee evidence/npm-ci.log
      - name: Test source repair and configuration tools
        run: node --test tests/react-native-fontfit-source.test.mjs tests/react-native-textview-source.test.mjs tests/react-native-source-settings.test.mjs tests/react-native-source-kotlin.test.mjs tests/react-native-hermes-source-layout.test.mjs
      - name: Generate cloud Android project
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          npx expo prebuild --platform android --clean --no-install 2>&1 | tee evidence/prebuild.log
          node scripts/patch-react-native-gradle.js
          node scripts/react-native-fontfit/repair-fontfit-source.cjs "$GITHUB_WORKSPACE"
          node scripts/react-native-fontfit/repair-textview-source.cjs "$GITHUB_WORKSPACE"
          node scripts/configure-react-native-source.js
          node scripts/align-react-native-source-kotlin.cjs --source-build "$GITHUB_WORKSPACE"
          sha256sum node_modules/react-native/ReactAndroid/src/main/java/com/facebook/react/views/text/{TextLayoutManager.kt,ReactTextView.java} | tee evidence/rn-source.sha256
      - name: Repair and test real Hermes archive extraction
        run: |
          node scripts/react-native-fontfit/repair-hermes-source-layout.cjs
          node scripts/react-native-fontfit/test-hermes-archive.mjs
      - name: Execute actual dependency fitter regression
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          cd android
          ./gradlew :caption-media:dependencyInsight --dependency react-android --configuration releaseUnitTestRuntimeClasspath --no-daemon --console=plain | tee ../evidence/rn-classpath.txt
          ./gradlew :caption-media:testReleaseUnitTest --tests app.captionstudio.media.ReactNativeMinimumScaleMapBufferTest.literalKey10_reachesActualCreateLayout_floorIsLiteral20px --init-script ../scripts/react-native-fontfit/sdk36-test-runtime.init.gradle -Dorg.gradle.java.installations.auto-detect=false -Dorg.gradle.java.installations.auto-download=false -Dorg.gradle.java.installations.paths="$JAVA_HOME_17_X64,$JAVA_HOME_21_X64" --no-daemon --stacktrace --console=plain 2>&1 | tee ../evidence/native-audio.log
      - name: Retain complete raw evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: private-rn-minscale-raw-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: |
            evidence/
            modules/caption-media/android/build/test-results/
            modules/caption-media/android/build/reports/tests/
          if-no-files-found: error
          retention-days: 90
