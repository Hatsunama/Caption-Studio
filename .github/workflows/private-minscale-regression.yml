name: Private actual RN minimum-scale integration

on:
  push:
    branches: [diagnostic/minscale-regression-20261108]

permissions:
  contents: read

jobs:
  native-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.4
          cache: npm
      - name: Fetch and verify exact signed build JDKs
        run: |
          mkdir -p evidence
          node scripts/build-toolchain/verified-java-download.mjs --install "$RUNNER_TOOL_CACHE" --receipt "$GITHUB_WORKSPACE/evidence/verified-java.json"
      - name: Harden and verify Java trust stores
        run: node scripts/harden-java-truststores.mjs --ci
      - name: Install locked dependencies
        run: |
          set -o pipefail
          mkdir -p evidence
          npm ci 2>&1 | tee evidence/npm-ci.log
      - name: Test source repair and configuration tools
        run: node --test tests/react-native-final-source.test.mjs tests/react-native-fontfit-source.test.mjs tests/react-native-textview-source.test.mjs tests/react-native-source-settings.test.mjs tests/react-native-source-kotlin.test.mjs tests/react-native-hermes-source-layout.test.mjs
      - name: Generate cloud Android project
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          npx expo prebuild --platform android --clean --no-install 2>&1 | tee evidence/prebuild.log
          node scripts/patch-react-native-gradle.js
          node scripts/react-native-fontfit/install-final-sources.cjs "$GITHUB_WORKSPACE"
          node scripts/configure-react-native-source.js
          node scripts/align-react-native-source-kotlin.cjs --source-build "$GITHUB_WORKSPACE"
          sha256sum node_modules/react-native/ReactAndroid/src/main/java/com/facebook/react/views/text/{TextLayoutManager.kt,PreparedLayout.kt,ReactTextViewManager.kt,ReactTextView.java} node_modules/react-native/ReactCommon/react/renderer/attributedstring/conversions.h node_modules/react-native/ReactAndroid/src/main/java/com/facebook/react/fabric/FabricUIManager.java | tee evidence/rn-source.sha256
      - name: Repair and test real Hermes archive extraction
        run: |
          node scripts/react-native-fontfit/repair-hermes-source-layout.cjs
          node scripts/react-native-fontfit/test-hermes-archive.mjs
      - name: Execute actual dependency fitter regression
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          cd android
          ./gradlew :caption-media:dependencyInsight --dependency react-android --configuration releaseUnitTestRuntimeClasspath --no-daemon --console=plain | tee ../evidence/rn-classpath.txt
          ./gradlew :caption-media:testReleaseUnitTest --init-script ../scripts/react-native-fontfit/sdk36-test-runtime.init.gradle -Dorg.gradle.java.installations.auto-detect=false -Dorg.gradle.java.installations.auto-download=false -Dorg.gradle.java.installations.paths="$JAVA_HOME_17_X64,$JAVA_HOME_21_X64" --no-daemon --stacktrace --console=plain 2>&1 | tee ../evidence/native-audio.log
      # Preserve the native result before the expensive C++ build can reach its budget.
      - name: Retain native evidence before APK build
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: private-rn-minscale-native-${{ github.sha }}-${{ github.run_id }}
          path: |
            evidence/
            modules/caption-media/android/build/test-results/
            modules/caption-media/android/build/reports/tests/
          if-no-files-found: error
          retention-days: 90
      - name: Configure ephemeral CI release signing
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/caption-studio-ci-release.p12"
          password="caption-studio-ci-only"
          keytool -genkeypair -noprompt \
            -storetype PKCS12 \
            -keystore "$keystore" \
            -storepass "$password" \
            -keypass "$password" \
            -alias caption-studio-ci \
            -keyalg RSA \
            -keysize 3072 \
            -sigalg SHA256withRSA \
            -validity 2 \
            -dname "CN=Caption Studio CI,OU=Release Verification,O=Hatsunama,C=US"
          chmod 600 "$keystore"
          mkdir -p "$HOME/.gradle"
          chmod 700 "$HOME/.gradle"
          {
            echo "CAPTION_STUDIO_RELEASE_STORE_FILE=$keystore"
            echo "CAPTION_STUDIO_RELEASE_STORE_PASSWORD=$password"
            echo "CAPTION_STUDIO_RELEASE_KEY_ALIAS=caption-studio-ci"
            echo "CAPTION_STUDIO_RELEASE_KEY_PASSWORD=$password"
          } >> "$HOME/.gradle/gradle.properties"
          chmod 600 "$HOME/.gradle/gradle.properties"

      - name: Build private source-RN APK for physical verification
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          cd android
          ./gradlew :app:dependencyInsight --dependency hermes-android --configuration releaseRuntimeClasspath --no-daemon --console=plain | tee ../evidence/app-hermes-classpath.txt
          ./gradlew :app:dependencyInsight --dependency react-android --configuration releaseRuntimeClasspath --no-daemon --console=plain | tee ../evidence/app-rn-classpath.txt
          ./gradlew :app:dependencyInsight --dependency kotlin-stdlib --configuration releaseRuntimeClasspath --no-daemon --console=plain | tee ../evidence/app-kotlin-classpath.txt
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace --warning-mode all 2>&1 | tee ../evidence/private-source-apk-build.log
      - name: Verify private artifact identity and ABI compatibility
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          aab="android/app/build/outputs/bundle/release/app-release.aab"
          node scripts/verify-android-abi.mjs --apk "$apk" --aab "$aab"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/aapt" dump badging "$apk" | tee evidence/private-apk-badging.txt
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" | tee evidence/private-apk-certificate.txt
          grep -Fq 'CN=Caption Studio CI' evidence/private-apk-certificate.txt
          "$build_tools/zipalign" -c -P 16 4 "$apk"
          ndk_root="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          bash scripts/check-elf-16k-alignment.sh "$apk" "$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"
          jarsigner -verify "$aab"
          sha256sum "$apk" "$aab" | tee evidence/private-artifact.sha256
      - name: Retain private source-RN test artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: private-source-rn-test-only-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: Retain complete raw evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: private-rn-minscale-raw-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: |
            evidence/
            modules/caption-media/android/build/test-results/
            modules/caption-media/android/build/reports/tests/
          if-no-files-found: error
          retention-days: 90
