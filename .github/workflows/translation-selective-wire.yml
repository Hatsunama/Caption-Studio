name: Selective prompt serialization RED GREEN
on:
  push:
    branches: [codex/translation-selective-wire-review]
permissions:
  contents: read
concurrency:
  group: selective-wire-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: true
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.4
      - name: Fetch and verify exact signed build JDKs
        run: |
          mkdir -p evidence
          node scripts/build-toolchain/verified-java-download.mjs --install "$RUNNER_TOOL_CACHE" --receipt "$GITHUB_WORKSPACE/evidence/verified-java.json"
      - name: Harden and verify Java trust stores
        run: node scripts/harden-java-truststores.mjs --ci
      - name: Install locked dependencies for GREEN full checks only
        shell: bash
        run: |
          if [ "$(cat tests/serialization-stage.txt)" = GREEN ]; then
            npm ci --no-audit --no-fund
          fi
      - name: Execute compiled production serialization and full GREEN gates
        run: python3 -B tests/translation-serialization-cloud.py
      - name: Compile receipt against actual Android36 API and check byte identity
        run: python3 -B tests/receipt-android-api-compile.py
      - name: Execute real Android release unit-test gate only after helper fix
        shell: bash
        env:
          NODE_ENV: production
          CAPTION_STUDIO_EXPECTED_ANDROID_PACKAGE: com.xmilo_at_your_side.caption_studio
        run: |
          set -euo pipefail
          if [ "$(cat tests/receipt-compat-stage.txt)" != GREEN ]; then exit 0; fi
          node --max-old-space-size=128 --test --test-concurrency=1 tests/build-tools/react-native-final-source.test.mjs tests/build-tools/react-native-source-settings.test.mjs tests/build-tools/react-native-source-kotlin.test.mjs tests/build-tools/react-native-hermes-source-layout.test.mjs tests/build-tools/android-runtime-preparation.test.cjs tests/build-tools/android-runtime-repeatability.test.cjs
          npx expo prebuild --platform android --clean --no-install
          node ./scripts/prepare-android-runtime.cjs --after-prebuild .
          npm run verify:android-config
          keystore="$RUNNER_TEMP/receipt-test-only.p12"
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$keystore"             -storepass caption-studio-ci-only -keypass caption-studio-ci-only             -alias caption-studio-ci -keyalg RSA -keysize 3072 -sigalg SHA256withRSA             -validity 2 -dname "CN=Caption Studio CI,OU=Receipt Test,O=Hatsunama,C=US"
          mkdir -p "$HOME/.gradle"
          {
            echo "CAPTION_STUDIO_RELEASE_STORE_FILE=$keystore"
            echo "CAPTION_STUDIO_RELEASE_STORE_PASSWORD=caption-studio-ci-only"
            echo "CAPTION_STUDIO_RELEASE_KEY_ALIAS=caption-studio-ci"
            echo "CAPTION_STUDIO_RELEASE_KEY_PASSWORD=caption-studio-ci-only"
          } >> "$HOME/.gradle/gradle.properties"
          set -euo pipefail
          mkdir -p evidence
          sha256sum node_modules/react-native/ReactAndroid/src/main/java/com/facebook/react/views/text/TextLayoutManager.kt node_modules/react-native/ReactAndroid/src/main/java/com/facebook/react/views/text/PreparedLayout.kt node_modules/react-native/ReactAndroid/src/main/java/com/facebook/react/views/text/ReactTextViewManager.kt node_modules/react-native/ReactAndroid/src/main/java/com/facebook/react/views/text/ReactTextView.java node_modules/react-native/ReactCommon/react/renderer/attributedstring/conversions.h node_modules/react-native/ReactAndroid/src/main/java/com/facebook/react/fabric/FabricUIManager.java node_modules/react-native/gradle/libs.versions.toml node_modules/react-native/ReactAndroid/hermes-engine/build.gradle.kts android/settings.gradle | tee evidence/rn-runtime-targets.sha256
          ./android/gradlew -p android :app:dependencyInsight --dependency react-android --configuration releaseRuntimeClasspath --no-daemon --console=plain 2>&1 | tee evidence/app-react-android-runtime.txt
          ./android/gradlew -p android :app:dependencyInsight --dependency hermes-android --configuration releaseRuntimeClasspath --no-daemon --console=plain 2>&1 | tee evidence/app-hermes-android-runtime.txt
          ./android/gradlew -p android :app:dependencyInsight --dependency kotlin-stdlib --configuration releaseRuntimeClasspath --no-daemon --console=plain 2>&1 | tee evidence/app-kotlin-stdlib-runtime.txt
          cd android
          ./gradlew :app:testReleaseUnitTest :caption-diagnostics:testReleaseUnitTest             :caption-media:testReleaseUnitTest :caption-translation:testReleaseUnitTest             --init-script ../scripts/react-native-fontfit/sdk36-test-runtime.init.gradle -Dorg.gradle.java.installations.auto-detect=false -Dorg.gradle.java.installations.auto-download=false -Dorg.gradle.java.installations.paths="$JAVA_HOME_17_X64,$JAVA_HOME_21_X64" --no-daemon --stacktrace --warning-mode all
      - name: Preserve exact RED or GREEN receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selective-wire-${{ github.sha }}
          path: |
            serialization-repair-results.json
            serialization-behavior.json
            receipt-android-api-results.json
            android/app/build/test-results/testReleaseUnitTest/
            modules/caption-diagnostics/android/build/test-results/testReleaseUnitTest/
            modules/caption-media/android/build/test-results/testReleaseUnitTest/
            modules/caption-translation/android/build/test-results/testReleaseUnitTest/
          if-no-files-found: error
          retention-days: 14

      - name: Retain RN source runtime and native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rn-runtime-translation-selective-wire-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/
            modules/caption-*/android/build/test-results/
          if-no-files-found: warn
          retention-days: 14
