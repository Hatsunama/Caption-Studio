name: Dependency gate audit 20261004
on:
  push:
    branches: ["quality-round/20261004/dependency-gate-audit"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.1
          package-manager-cache: false
      - name: Install unchanged locked baseline in cloud
        run: npm ci
      - name: Reproduce audit and affected dependency behaviors
        run: node quality-round/20261004/dependency-gate-audit/audit.cjs
      - name: Retain red audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-gate-audit-${{ github.sha }}
          path: ${{ runner.temp }}/dependency-gate-audit/
          retention-days: 14
          if-no-files-found: error
