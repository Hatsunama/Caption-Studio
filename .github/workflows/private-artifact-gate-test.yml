name: Private artifact gate behavioral test

on:
  push:
    branches: [main, codex/local-signing-transition-20261025]
    paths:
      - .github/workflows/publish-sidecar.yml
      - .github/workflows/verify-play-aab.yml
      - .github/workflows/recover-local-signing.yml
      - .github/workflows/private-artifact-gate-test.yml
      - scripts/test-private-artifact-gate.mjs
      - tests/cloud-signing-retirement.test.mjs

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        state: [success, failure, cancelled, recovery]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/test-private-artifact-gate.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - name: Execute retired workflow refusal matrix
        env:
          GATE_STATE: ${{ matrix.state }}
          GATE_WORKSPACE: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          node --max-old-space-size=64 scripts/test-private-artifact-gate.mjs
