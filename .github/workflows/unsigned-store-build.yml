name: Future unsigned store build (no signing or publishing)
on:
  workflow_dispatch:
    inputs:
      version:
        description: Canonical MAJOR.MINOR.PATCH newer than all published releases
        required: true
        type: string
      versionCode:
        description: Canonical positive Android versionCode newer than published history
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/unsigned-store-build.yml
      - scripts/unsigned-store-build.mjs
      - tests/unsigned-store-build.test.mjs
      - docs/unsigned-local-release-build.md
permissions:
  contents: read
concurrency:
  group: unsigned-store-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.4
      - name: Synthetic producer acceptance tests (no install, native build or credentials)
        run: node --max-old-space-size=64 --test tests/unsigned-store-build.test.mjs
  unsigned:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Hatsunama/Caption-Studio' &&
      github.repository_owner == 'Hatsunama' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Hatsunama' &&
      github.triggering_actor == 'Hatsunama'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI: 'true'
      VERSION: ${{ inputs.version }}
      VERSION_CODE: ${{ inputs.versionCode }}
      CAPTION_STUDIO_EXPECTED_ANDROID_PACKAGE: com.xmilo_at_your_side.caption_studio
    steps:
      - name: Assert exact owner, repository, main dispatch and canonical inputs BEFORE checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = Hatsunama/Caption-Studio
          test "$GITHUB_REPOSITORY_OWNER" = Hatsunama
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = Hatsunama
          test "$GITHUB_TRIGGERING_ACTOR" = Hatsunama
          test "$GITHUB_WORKFLOW_REF" = Hatsunama/Caption-Studio/.github/workflows/unsigned-store-build.yml@refs/heads/main
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.4
          cache: npm
      - name: Install companion build JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21.0.13+9'
          check-latest: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17.0.21+9'
          check-latest: true
      - name: Harden and verify Java trust stores
        run: node scripts/harden-java-truststores.mjs --ci
      - name: Verify authoritative source and reject signing inputs before installation
        run: node scripts/unsigned-store-build.mjs --approve "$VERSION" "$VERSION_CODE"
      - name: Producer acceptance tests before dependency installation
        run: node --max-old-space-size=64 --test tests/unsigned-store-build.test.mjs
      - name: Read-only published-history and version check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export SIDECAR_BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          test -x "$SIDECAR_BUILD_TOOLS/aapt"
          test -x "$SIDECAR_BUILD_TOOLS/apksigner"
          node scripts/configure-sidecar-release.mjs --check-published "$VERSION" "$VERSION_CODE"
      - name: Full existing source release checks (lock, audit, logic, TypeScript, lint, Expo)
        run: |
          set -euo pipefail
          npm ci
          npm run verify:product-contract
          npm audit --omit=dev --audit-level=high
          npm run test:logic
          npx tsc --noEmit
          npm run lint
          npx expo install --check
          npx --yes expo-doctor@1.21.5
          node scripts/unsigned-store-build.mjs --approve "$VERSION" "$VERSION_CODE"
      - name: Apply exact shared checkout-only release identity stamp
        run: node scripts/unsigned-store-build.mjs --prepare "$VERSION" "$VERSION_CODE"
      - name: Clean native prebuild and original release configuration verification
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --clean --no-install
          node scripts/patch-react-native-gradle.js
          npm run verify:android-config
      - name: Behaviorally reject injected signing properties and both environment forms
        working-directory: android
        env:
          NODE_ENV: production
        shell: bash
        run: |
          set -euo pipefail
          for name in CAPTION_STUDIO_RELEASE_STORE_FILE CAPTION_STUDIO_RELEASE_STORE_PASSWORD CAPTION_STUDIO_RELEASE_KEY_ALIAS CAPTION_STUDIO_RELEASE_KEY_PASSWORD CAPTION_STUDIO_PLAY_KEYSTORE_BASE64 CAPTION_STUDIO_FIXED_KEY_PASSWORD KEYSTORE_BASE64; do
            if ./gradlew help "-P$name=FORBIDDEN-TEST-INPUT" --init-script ../scripts/unsigned-play-release.gradle --no-daemon > "$RUNNER_TEMP/unsigned-refusal.log" 2>&1; then
              echo 'Unsigned init accepted credential property' >&2; exit 1
            fi
            grep -Fq "Unsigned packaging refuses signing credential input: $name" "$RUNNER_TEMP/unsigned-refusal.log"
            for prefix in '' ORG_GRADLE_PROJECT_; do
              if env "${prefix}${name}=FORBIDDEN-TEST-INPUT" ./gradlew help --init-script ../scripts/unsigned-play-release.gradle --no-daemon > "$RUNNER_TEMP/unsigned-refusal.log" 2>&1; then
                echo 'Unsigned init accepted credential environment' >&2; exit 1
              fi
              grep -Fq 'Unsigned packaging refuses signing credential input:' "$RUNNER_TEMP/unsigned-refusal.log"
            done
          done
      - name: Original native release lint responsibilities
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew :app:lintRelease --init-script ../scripts/unsigned-play-release.gradle --init-script ../scripts/first-party-android-lint.gradle --no-daemon --stacktrace --warning-mode all
      - name: All original native release unit test responsibilities
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew :app:testReleaseUnitTest :caption-diagnostics:testReleaseUnitTest :caption-media:testReleaseUnitTest :caption-translation:testReleaseUnitTest --init-script ../scripts/unsigned-play-release.gradle --no-daemon --stacktrace --warning-mode all
      - name: Assemble unsigned APK and bundle unsigned AAB with the existing unsigned init script
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew :app:assembleRelease :app:bundleRelease --init-script ../scripts/unsigned-play-release.gradle --no-daemon --stacktrace --warning-mode all
      - name: Download checksum-pinned bundletool 1.18.3
        run: |
          set -euo pipefail
          test ! -e "$RUNNER_TEMP/bundletool.jar"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  '"$RUNNER_TEMP/bundletool.jar" | sha256sum --check --status
      - name: Verify unsigned APK, AAB, exact mapping and atomically publish public provenance
        run: |
          set -euo pipefail
          ndk_root="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          objdump="$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"
          test -x "$objdump"
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign"
          node scripts/unsigned-store-build.mjs --verify "$VERSION" "$VERSION_CODE" "$RUNNER_TEMP/bundletool.jar" "$objdump" "$ANDROID_HOME/build-tools/36.0.0" "$RUNNER_TEMP"
      - name: Retain original native reports even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unsigned-store-native-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            android/app/build/reports/
            android/app/build/test-results/
            modules/caption-*/android/build/reports/tests/
            modules/caption-*/android/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain UNSIGNED NOT INSTALLABLE payloads for separate future local signing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: caption-studio-UNSIGNED-not-installable-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/unsigned-store/caption-studio-UNSIGNED-not-installable.apk
            dist/unsigned-store/caption-studio-UNSIGNED-not-installable.aab
            dist/unsigned-store/mapping.txt
            dist/unsigned-store/provenance.json
          if-no-files-found: error
          retention-days: 14
