name: Verify exact final Android bytes (draft assets, no signing or publishing)
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Numeric owner-created DRAFT release ID targeting the exact source commit
        required: true
        type: string
      expected_source_commit:
        description: Exact 40-character source SHA from final local signing receipt
        required: true
        type: string
      solana_asset_id:
        description: Numeric caption-studio-android.apk draft asset ID
        required: true
        type: string
      solana_sha256:
        description: Expected final Solana APK SHA256
        required: true
        type: string
      play_asset_id:
        description: Numeric caption-studio-play-universal.apk draft asset ID (derived and Play-signed locally)
        required: true
        type: string
      play_sha256:
        description: Expected final Play universal APK SHA256
        required: true
        type: string
      aab_asset_id:
        description: Numeric caption-studio-play-android.aab draft asset ID
        required: true
        type: string
      aab_sha256:
        description: Expected final locally Play-signed AAB SHA256
        required: true
        type: string
      receipt_asset_id:
        description: Numeric source-signature-receipt.json draft asset ID
        required: true
        type: string
      receipt_sha256:
        description: Expected final local source-signature receipt SHA256
        required: true
        type: string
permissions:
  contents: read
env:
  RELEASE_ID: ${{ inputs.release_id }}
  EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
  SOLANA_ASSET_ID: ${{ inputs.solana_asset_id }}
  SOLANA_SHA256: ${{ inputs.solana_sha256 }}
  PLAY_ASSET_ID: ${{ inputs.play_asset_id }}
  PLAY_SHA256: ${{ inputs.play_sha256 }}
  AAB_ASSET_ID: ${{ inputs.aab_asset_id }}
  AAB_SHA256: ${{ inputs.aab_sha256 }}
  RECEIPT_ASSET_ID: ${{ inputs.receipt_asset_id }}
  RECEIPT_SHA256: ${{ inputs.receipt_sha256 }}
concurrency:
  group: exact-final-runtime-${{ inputs.release_id }}
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository == 'Hatsunama/Caption-Studio' &&
      github.repository_owner == 'Hatsunama' && github.ref == 'refs/heads/codex/final150-runtime-diagnostic' &&
      github.actor == 'Hatsunama' && github.triggering_actor == 'Hatsunama' &&
      github.workflow_ref == 'Hatsunama/Caption-Studio/.github/workflows/verify-final-android-runtime.yml@refs/heads/codex/final150-runtime-diagnostic'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Read-only owner probe returned403 for drafts; only this GET/hash job needs push access.
    # It runs no app/emulator code. Runtime jobs below remain read-only.
    permissions:
      contents: write
    outputs:
      artifact_id: ${{ steps.signed_inputs.outputs.artifact-id }}
      artifact_name: ${{ steps.prepare_identity.outputs.artifact_name }}
    steps:
      - name: Verify exact owner and exact diagnostic branch dispatch before checkout or token use
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = Hatsunama/Caption-Studio
          test "$GITHUB_REPOSITORY_OWNER" = Hatsunama
          test "$GITHUB_REF" = refs/heads/codex/final150-runtime-diagnostic
          test "$GITHUB_ACTOR" = Hatsunama
          test "$GITHUB_TRIGGERING_ACTOR" = Hatsunama
          test "$GITHUB_WORKFLOW_REF" = Hatsunama/Caption-Studio/.github/workflows/verify-final-android-runtime.yml@refs/heads/codex/final150-runtime-diagnostic
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Fetch and hash only selected owner draft assets (no execution)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/verify-android-native-compatibility-runtime.py download --directory "$RUNNER_TEMP/final-assets" --evidence evidence/final-runtime
      - name: Preserve prepare producer identity across failed-job reruns
        id: prepare_identity
        shell: bash
        run: echo "artifact_name=final-signed-inputs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Transfer only four hash-verified public signed files and bound request
        id: signed_inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.prepare_identity.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/final-assets/caption-studio-android.apk
            ${{ runner.temp }}/final-assets/caption-studio-play-universal.apk
            ${{ runner.temp }}/final-assets/caption-studio-play-android.aab
            ${{ runner.temp }}/final-assets/source-signature-receipt.json
            ${{ runner.temp }}/final-assets/request.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Retain sanitized prepare failure evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: final-runtime-prepare-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/final-runtime/
          if-no-files-found: warn
          retention-days: 14
  runtime:
    needs: prepare
    permissions:
      contents: read
      actions: read
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository == 'Hatsunama/Caption-Studio' &&
      github.repository_owner == 'Hatsunama' && github.ref == 'refs/heads/codex/final150-runtime-diagnostic' &&
      github.actor == 'Hatsunama' && github.triggering_actor == 'Hatsunama' &&
      github.workflow_ref == 'Hatsunama/Caption-Studio/.github/workflows/verify-final-android-runtime.yml@refs/heads/codex/final150-runtime-diagnostic'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - api: 24
            arch: x86
            ram: 1536M
          - api: 25
            arch: x86_64
            ram: 6144M
          - api: 26
            arch: x86_64
            ram: 6144M
    steps:
      - name: Verify exact owner and exact diagnostic branch dispatch before checkout or token use
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = Hatsunama/Caption-Studio
          test "$GITHUB_REPOSITORY_OWNER" = Hatsunama
          test "$GITHUB_REF" = refs/heads/codex/final150-runtime-diagnostic
          test "$GITHUB_ACTOR" = Hatsunama
          test "$GITHUB_TRIGGERING_ACTOR" = Hatsunama
          test "$GITHUB_WORKFLOW_REF" = Hatsunama/Caption-Studio/.github/workflows/verify-final-android-runtime.yml@refs/heads/codex/final150-runtime-diagnostic
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - name: Fetch and verify exact signed build JDKs
        run: |
          mkdir -p evidence/final-runtime
          node scripts/build-toolchain/verified-java-download.mjs --install "$RUNNER_TOOL_CACHE" --receipt "$GITHUB_WORKSPACE/evidence/verified-java.json"
      - name: Harden and verify Java trust stores
        run: node scripts/harden-java-truststores.mjs --ci
      - name: Retain verified Java receipt with runtime evidence
        run: cp evidence/verified-java.json evidence/final-runtime/verified-java.json
      - name: Run key-free harness regressions
        run: |
          python3 -B tests/verify-android-native-compatibility.test.py
          python3 -B tests/verify-android-native-compatibility-runtime.test.py
          python3 -B tests/runtime-download-diagnostics.test.py
          python3 -B tests/install-runtime-android-build-tools.test.py
          python3 -B tests/runtime-file-verification.test.py
          python3 -B tests/runtime-adb-diagnostics.test.py
          python3 -B tests/runtime-old-api-network.test.py
          python3 -B tests/runtime-log-boundary.test.py
          python3 -B tests/runtime-documents-item.test.py
      - name: Retrieve this run's immutable inputs and independently rebind source and hashes
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE_ARTIFACT_ID: ${{ needs.prepare.outputs.artifact_id }}
          PREPARE_ARTIFACT_NAME: ${{ needs.prepare.outputs.artifact_name }}
        run: python3 -B scripts/verify-android-native-compatibility-runtime.py receive --directory "$RUNNER_TEMP/final-assets" --evidence evidence/final-runtime
      - name: Prepare video tool and isolated KVM access
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install --no-install-recommends -y ffmpeg; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install approved Android Build Tools for exact-byte verification
        run: python3 -B scripts/install-runtime-android-build-tools.py
      - name: Run bounded launcher behavioral regressions (host only)
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: python3 -B tests/bounded-emulator-launcher.test.py
      - name: Test both final APKs on isolated emulator with actual Home and import interactions
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: python3 -B scripts/launch-runtime-emulator.py --api '${{ matrix.api }}' --arch '${{ matrix.arch }}'
      - name: Retain runtime evidence and failure state (never signed asset payloads or keys)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: final-runtime-api${{ matrix.api }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/final-runtime/
          if-no-files-found: warn
          retention-days: 14
