name: Subtitle export verification 122 tool
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: share-recipient-verification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verification-tool:
    if: github.ref == 'refs/heads/codex/subtitle-export-verification-122'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
          sparse-checkout: |
            tools/share-recipient-verification
          sparse-checkout-cone-mode: false
      - name: Select stock Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Execute pure Java tests first
        run: bash tools/share-recipient-verification/test.sh
      - name: Retain executing regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: subtitle-regressions-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            tools/share-recipient-verification/out/tests.txt
            tools/share-recipient-verification/out/subtitle-regressions.txt
      - name: Install official Android SDK tools only
        run: |
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Build ephemeral debug APK and audit package
        run: bash tools/share-recipient-verification/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: caption-studio-subtitle-verification-122-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            tools/share-recipient-verification/out/caption-studio-verification-debug.apk
            tools/share-recipient-verification/out/apk.sha256
            tools/share-recipient-verification/out/evidence.txt
            tools/share-recipient-verification/out/tests.txt
            tools/share-recipient-verification/out/audit.txt
            tools/share-recipient-verification/out/permissions.txt
            tools/share-recipient-verification/out/badging.txt
            tools/share-recipient-verification/out/manifest.txt
            tools/share-recipient-verification/out/signature.txt
            tools/share-recipient-verification/out/alignment.txt
            tools/share-recipient-verification/out/subtitle-regressions.txt
            tools/share-recipient-verification/out/change-impact.txt
