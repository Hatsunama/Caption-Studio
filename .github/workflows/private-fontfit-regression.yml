name: Private actual RN font-fit regression

on:
  push:
    branches: [diagnostic/fontfit-regression-20261108]

permissions:
  contents: read

jobs:
  native-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.4
          cache: npm
      - name: Install companion build JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'
          force-download: true
          verify-signature: true
          cache-jdk: false
          check-latest: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17.0.21+9'
          force-download: true
          verify-signature: true
          cache-jdk: false
          check-latest: true
          cache: gradle
      - name: Harden and verify Java trust stores
        run: node scripts/harden-java-truststores.mjs --ci
      - name: Install locked dependencies
        run: |
          set -o pipefail
          mkdir -p evidence
          npm ci 2>&1 | tee evidence/npm-ci.log
      - name: Generate cloud Android project
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          npx expo prebuild --platform android --clean --no-install 2>&1 | tee evidence/prebuild.log
          node scripts/patch-react-native-gradle.js
          sha256sum node_modules/react-native/ReactAndroid/src/main/java/com/facebook/react/views/text/TextLayoutManager.kt | tee evidence/rn-source.sha256
      - name: Execute actual dependency fitter regression
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          cd android
          ./gradlew :caption-media:dependencyInsight --dependency react-android --configuration releaseUnitTestRuntimeClasspath --no-daemon --console=plain | tee ../evidence/rn-classpath.txt
          ./gradlew :caption-media:testReleaseUnitTest --tests app.captionstudio.media.ReactNativeFontFitRegressionTest --no-daemon --stacktrace --console=plain 2>&1 | tee ../evidence/native-audio.log
      - name: Retain complete raw evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: private-rn-fontfit-raw-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: |
            evidence/
            modules/caption-media/android/build/test-results/
            modules/caption-media/android/build/reports/tests/
          if-no-files-found: error
          retention-days: 90
