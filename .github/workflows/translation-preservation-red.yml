name: Translation preservation RED evidence
on:
  push:
    branches: [codex/translation-preservation-boundary]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: 17
      - name: Install locked test dependencies
        run: npm ci --no-audit --no-fund
      - name: Record baseline and new regression runtime results
        run: python3 tests/translation-preservation-cloud.py
      - name: Retain RED results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: translation-preservation-red
          path: preservation-red-results.json
          retention-days: 14
