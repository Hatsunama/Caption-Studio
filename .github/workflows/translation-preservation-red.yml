name: Translation preservation repair checks
on:
  push:
    branches: [codex/translation-preservation-boundary, codex/preservation-runtime-contract, codex/source-echo-protected-composition, codex/translation-native-cancel-cause]
permissions:
  contents: read
env:
  CI: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: 17
      - name: Install locked test dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify published dependency regressions and consumer compatibility
        run: |
          node --test tests/published-dependency-regressions.cjs
          node tests/dependency-api-compatibility.cjs
      - name: Run full suites, preservation regressions, and repository gates
        run: python3 tests/translation-preservation-cloud.py
      - name: Retain repair check results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: translation-preservation-repair
          path: preservation-repair-results.json
          retention-days: 14
