name: Publish fixed side-by-side Android release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version written into the APK
        required: true
        type: string
      version_code:
        description: Monotonically increasing Android versionCode
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: caption-studio-fixed-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.1
          cache: npm
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Validate release inputs
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.version_code }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          tag="v${VERSION}-fixed.1"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing replacement." >&2
            exit 1
          fi
      - name: Install and verify locked project
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run test:logic
          npx tsc --noEmit
          npm run lint
          npx expo install --check
          npx --yes expo-doctor@1.20.4

      - name: Configure fixed side-by-side identity
        env:
          VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: node ./scripts/configure-sidecar-release.mjs "$VERSION" "$VERSION_CODE"

      - name: Generate clean Android project
        env:
          NODE_ENV: production
        run: |
          npx expo prebuild --platform android --clean --no-install
          node ./scripts/patch-react-native-gradle.js
          npm run verify:android-config

      - name: Configure stable fixed-release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.CAPTION_STUDIO_FIXED_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CAPTION_STUDIO_FIXED_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CAPTION_STUDIO_FIXED_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CAPTION_STUDIO_FIXED_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          keystore="$RUNNER_TEMP/caption-studio-fixed-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          mkdir -p "$HOME/.gradle"
          chmod 700 "$HOME/.gradle"
          {
            echo "CAPTION_STUDIO_RELEASE_STORE_FILE=$keystore"
            echo "CAPTION_STUDIO_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "CAPTION_STUDIO_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "CAPTION_STUDIO_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$HOME/.gradle/gradle.properties"
          chmod 600 "$HOME/.gradle/gradle.properties"

      - name: Test and build fixed release APK
        env:
          NODE_ENV: production
        working-directory: android
        run: ./gradlew :caption-media:testReleaseUnitTest :caption-translation:testReleaseUnitTest :app:assembleRelease --no-daemon --stacktrace --warning-mode all

      - name: Verify and package APK
        id: package
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          source_apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$source_apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          ndk_root="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          badging="$($build_tools/aapt dump badging "$source_apk")"
          printf '%s\n' "$badging"
          grep -Fq "package: name='com.hatsunama.captionstudio.fixed' versionCode='$VERSION_CODE' versionName='$VERSION'" <<< "$badging"
          grep -Fq "targetSdkVersion:'36'" <<< "$badging"
          "$build_tools/zipalign" -c -P 16 4 "$source_apk"
          bash ./scripts/check-elf-16k-alignment.sh "$source_apk" "$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"
          certificate="$($build_tools/apksigner verify --verbose --print-certs "$source_apk")"
          printf '%s\n' "$certificate"
          if grep -Eqi "Android Debug|androiddebugkey|Caption Studio CI" <<< "$certificate"; then
            echo 'Fixed APK has an invalid signing identity.' >&2
            exit 1
          fi
          mkdir -p dist
          cp "$source_apk" dist/caption-studio-fixed-android.apk
          (cd dist && sha256sum caption-studio-fixed-android.apk > caption-studio-fixed-android.apk.sha256)

      - name: Publish immutable prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}-fixed.1"
          gh release create "$tag" \
            dist/caption-studio-fixed-android.apk \
            dist/caption-studio-fixed-android.apk.sha256 \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Caption Studio Fixed ${VERSION} (side-by-side)" \
            --notes "Side-by-side fixed build from main at $GITHUB_SHA. Installs as com.hatsunama.captionstudio.fixed and does not replace, uninstall, clear, or migrate the existing production app."

      - name: Retain fixed APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: caption-studio-fixed-${{ inputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
