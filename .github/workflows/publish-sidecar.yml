name: Retired publish-sidecar
# Compatibility tombstone. See docs/cloud-signing-retirement.md.
on:
  workflow_dispatch:
permissions: {}
jobs:
  retired:
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Refuse retired cloud signing and recovery
        if: always()
        shell: bash
        run: |
          echo 'RETIRED: use .github/workflows/unsigned-store-build.yml then scripts/local-signing/sign-release.ps1. See docs/cloud-signing-retirement.md.' >&2
          exit 1
