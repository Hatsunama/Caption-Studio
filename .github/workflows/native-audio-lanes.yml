name: Native timeline audio lanes

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/timeline-audio-bounded-lanes, codex/preservation-runtime-contract, codex/audio-cancellation-boundary]

permissions:
  contents: read

jobs:
  native-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.4
          cache: npm
      - name: Fetch and verify exact signed build JDKs
        run: |
          mkdir -p evidence
          node scripts/build-toolchain/verified-java-download.mjs --install "$RUNNER_TOOL_CACHE" --receipt "$GITHUB_WORKSPACE/evidence/verified-java.json"
      - name: Harden and verify Java trust stores
        run: node scripts/harden-java-truststores.mjs --ci
      - name: Install locked dependencies
        run: |
          set -o pipefail
          mkdir -p evidence
          npm ci 2>&1 | tee evidence/npm-ci.log
      - name: Generate cloud Android project
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          node --max-old-space-size=128 --test --test-concurrency=1 tests/build-tools/react-native-final-source.test.mjs tests/build-tools/react-native-source-settings.test.mjs tests/build-tools/react-native-source-kotlin.test.mjs tests/build-tools/react-native-hermes-source-layout.test.mjs tests/build-tools/android-runtime-preparation.test.cjs tests/build-tools/android-runtime-repeatability.test.cjs
          npx expo prebuild --platform android --clean --no-install 2>&1 | tee evidence/prebuild.log
          node scripts/prepare-android-runtime.cjs --after-prebuild .
      - name: Record resolved app runtime dependencies
        working-directory: android
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          sha256sum ../node_modules/react-native/ReactAndroid/src/main/java/com/facebook/react/views/text/TextLayoutManager.kt ../node_modules/react-native/ReactAndroid/src/main/java/com/facebook/react/views/text/PreparedLayout.kt ../node_modules/react-native/ReactAndroid/src/main/java/com/facebook/react/views/text/ReactTextViewManager.kt ../node_modules/react-native/ReactAndroid/src/main/java/com/facebook/react/views/text/ReactTextView.java ../node_modules/react-native/ReactCommon/react/renderer/attributedstring/conversions.h ../node_modules/react-native/ReactAndroid/src/main/java/com/facebook/react/fabric/FabricUIManager.java ../node_modules/react-native/gradle/libs.versions.toml ../node_modules/react-native/ReactAndroid/hermes-engine/build.gradle.kts settings.gradle | tee ../evidence/rn-runtime-targets.sha256
          ./gradlew :app:dependencyInsight --dependency react-android --configuration releaseRuntimeClasspath --no-daemon --console=plain 2>&1 | tee ../evidence/app-react-android-runtime.txt
          ./gradlew :app:dependencyInsight --dependency hermes-android --configuration releaseRuntimeClasspath --no-daemon --console=plain 2>&1 | tee ../evidence/app-hermes-android-runtime.txt
          ./gradlew :app:dependencyInsight --dependency kotlin-stdlib --configuration releaseRuntimeClasspath --no-daemon --console=plain 2>&1 | tee ../evidence/app-kotlin-stdlib-runtime.txt
          node --max-old-space-size=128 ../scripts/verify-native-notice-versions.cjs ../evidence/app-kotlin-stdlib-runtime.txt
      - name: Execute production composition regression
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          cd android
          ./gradlew :caption-media:testReleaseUnitTest --init-script ../scripts/react-native-fontfit/sdk36-test-runtime.init.gradle -Dorg.gradle.java.installations.auto-detect=false -Dorg.gradle.java.installations.auto-download=false -Dorg.gradle.java.installations.paths="$JAVA_HOME_17_X64,$JAVA_HOME_21_X64" --no-daemon --stacktrace --console=plain 2>&1 | tee ../evidence/native-audio.log
      - name: Retain complete raw evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-audio-raw-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: |
            evidence/
            modules/caption-media/android/build/test-results/
            modules/caption-media/android/build/reports/tests/
          if-no-files-found: error
          retention-days: 90

      - name: Retain RN source runtime and native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rn-runtime-native-audio-lanes-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/
            modules/caption-*/android/build/test-results/
          if-no-files-found: warn
          retention-days: 14
