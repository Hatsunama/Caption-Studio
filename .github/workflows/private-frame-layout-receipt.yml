name: Private frame-layout receipt regression

on:
  push:
    branches: [diagnostic/frame-layout-receipt-20261108]

permissions:
  contents: read

jobs:
  native-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.4
          cache: npm
      - name: Fetch and verify exact signed build JDKs
        run: |
          mkdir -p evidence
          node scripts/build-toolchain/verified-java-download.mjs --install "$RUNNER_TOOL_CACHE" --receipt "$GITHUB_WORKSPACE/evidence/verified-java.json"
      - name: Harden and verify Java trust stores
        run: node scripts/harden-java-truststores.mjs --ci
      - name: Install locked dependencies
        run: |
          set -o pipefail
          mkdir -p evidence
          npm ci 2>&1 | tee evidence/npm-ci.log
      - name: Generate cloud Android project
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          npx expo prebuild --platform android --clean --no-install 2>&1 | tee evidence/prebuild.log
          node scripts/patch-react-native-gradle.js
      - name: Execute production composition regression
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          cd android
          ./gradlew :caption-media:testReleaseUnitTest --no-daemon --stacktrace --console=plain 2>&1 | tee ../evidence/native-audio.log
      - name: Retain complete raw evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-audio-raw-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: |
            evidence/
            modules/caption-media/android/build/test-results/
            modules/caption-media/android/build/reports/tests/
          if-no-files-found: error
          retention-days: 90
