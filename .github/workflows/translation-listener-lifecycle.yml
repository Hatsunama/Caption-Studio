name: Translation listener lifecycle preservation checks
on:
  push:
    branches: [codex/translation-listener-lifecycle]
permissions:
  contents: read
env:
  CI: true
defaults:
  run:
    shell: bash
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.1
      - name: Install locked test dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify published dependency regressions and consumer compatibility
        run: |
          node --test tests/published-dependency-regressions.cjs
          node tests/dependency-api-compatibility.cjs
      - name: Run targeted translation lifecycle behavioral tests
        if: always()
        run: node --import tsx --test tests/translation-cancellation-failure.test.mjs 2>&1 | tee listener-targeted.txt
      - name: Run full npm logic suite
        if: always()
        run: npm run test:logic 2>&1 | tee listener-full-logic.txt
      - name: Typecheck
        if: always()
        run: node node_modules/typescript/bin/tsc --noEmit 2>&1 | tee listener-typecheck.txt
      - name: Lint
        if: always()
        run: npm run lint 2>&1 | tee listener-lint.txt
      - name: Retain listener lifecycle check results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: translation-listener-lifecycle
          path: listener-*.txt
          retention-days: 14
