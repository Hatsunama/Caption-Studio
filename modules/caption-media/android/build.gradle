plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.captionstudio'
version = '1.0.0'

// Read locally so this module also works without the generated application root.
def captionStudioMedia3Properties = new Properties()
file('media3-version.properties').withInputStream { captionStudioMedia3Properties.load(it) }
def captionStudioMedia3Version = captionStudioMedia3Properties.getProperty('media3Version')
if (captionStudioMedia3Version == null || !(captionStudioMedia3Version ==~ /\d+\.\d+\.\d+/)) {
  throw new GradleException('Caption Studio Media3 version is missing or invalid')
}

android {
  namespace = 'app.captionstudio.media'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
  testOptions {
    unitTests.includeAndroidResources = true
    unitTests.all {
      systemProperty 'captionStudio.fontDir', rootProject.file('../assets/fonts').absolutePath
      systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
    }
  }
  sourceSets {
    main {
      assets.srcDir file('../../../shared')
    }
  }
}

dependencies {
  // SDK 57 autolinking uses the publication by default; source opt-outs include this project.
  if (findProject(':expo-video') != null) {
    implementation project(':expo-video')
  } else {
    implementation 'host.exp.exponent:expo.modules.video:57.0.5'
  }
  implementation 'androidx.exifinterface:exifinterface:1.4.2'
  implementation "androidx.media3:media3-transformer:${captionStudioMedia3Version}"
  implementation "androidx.media3:media3-effect:${captionStudioMedia3Version}"
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.16.1'
}
